name: cena
description: "Cenas 3D da demo (flutter_scene): a plantadeira mostrando as seções e o talhão com o trator."
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.6
  vector_math: ^2.4.4
  agiso:
    path: ../agiso

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/
