site_name: Cabine ISOBUS em Flutter
site_description: Documentação técnica da cabine ISOBUS em Flutter (Dart FFI + AgIsoStack++) da demo do DevFest Cerrado Nortão 2026
site_url: https://jmfdev6.github.io/devfest-isobus-flutter/
repo_url: https://github.com/jmfdev6/devfest-isobus-flutter
repo_name: jmfdev6/devfest-isobus-flutter
edit_uri: edit/main/docs/
copyright: MIT · AgIsoStack++ © The Open-Agriculture Developers

theme:
  name: material
  language: pt-BR
  icon:
    logo: material/tractor
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Começar:
      - Instalação: instalacao.md
      - demo.sh e testes: demo.md
      - Roteiro da palestra: palestra.md
  - Arquitetura:
      - Visão geral: arquitetura.md
      - Ponte C e Dart FFI: ponte.md
      - Rede CAN e mensagens: rede-can.md
  - ISOBUS:
      - Terminal Virtual (VT): vt.md
      - Task Controller (TC): tc.md
  - Agricultura de precisão:
      - Talhão: talhao.md
      - Mapa de cobertura: mapa-aplicacao.md
  - Apps:
      - Simulador e física: simulador.md
      - 3D com flutter_scene: 3d.md
  - Referência:
      - Problemas comuns: problemas.md
      - Glossário: glossario.md
      - Contribuir: contribuir.md

validation:
  anchors: warn
  unrecognized_links: warn
